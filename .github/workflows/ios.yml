name: iOS 빌드

# 아이폰 앱은 맥에서만 만들 수 있다. 그래서 깃허브가 빌려주는 맥에서 빌드한다.
# 윈도우에서는 SwiftUI 를 띄워볼 수 없으므로, 여기서 시뮬레이터를 켜고 화면을 찍어 올린다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 실기기용 빌드와 ipa 까지 만들기
        type: boolean
        default: false

# 새로 푸시하면 돌던 빌드를 취소한다.
# 안 그러면 밀린 빌드가 다 돌아서 줄이 길어지고, 결과는 어차피 마지막 것만 쓴다.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 앱 빌드
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write   # 찍은 화면을 screenshots 가지에 올리려면 필요하다

    steps:
      - uses: actions/checkout@v5

      - name: Xcode 고르기
        # 리퀴드 글래스는 iOS 26 SDK 로만 컴파일된다. 즉 Xcode 26 이 있어야 한다.
        # 깃허브 액션 로그는 로그인해야 보이므로, 뭘 골랐는지 주석으로도 남긴다.
        run: |
          LIST=$(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')
          echo "깔려 있는 Xcode: $LIST"
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          VER=$(xcodebuild -version | head -1)
          SDK=$(xcodebuild -showsdks 2>/dev/null | grep -o 'iphoneos[0-9.]*' | tail -1)
          echo "고른 것: $VER (SDK $SDK)"
          echo "::notice title=Xcode::$VER · SDK $SDK · 깔린 것 [$LIST]"
          # 리퀴드 글래스를 쓸 수 있는지 뒷단계에서 쓰려고 남긴다
          MAJOR=$(echo "$VER" | grep -o '[0-9]\+' | head -1)
          echo "XCODE_MAJOR=$MAJOR" >> "$GITHUB_ENV"

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 만들기
        run: |
          source scripts/ci-run.sh
          run "xcodegen" xcodegen generate --spec project.yml

      - name: 시뮬레이터용 빌드
        run: |
          source scripts/ci-run.sh
          run "시뮬레이터 빌드" xcodebuild \
            -project Suhak.xcodeproj \
            -scheme Suhak \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 화면 찍기
        # 윈도우에서는 앱을 못 띄우니 여기서 찍어 올린다.
        # 실패해도 빌드는 통과시킨다. 화면 찍기는 확인용이지 빌드 조건이 아니다
        continue-on-error: true
        run: |
          set -x
          APP=$(find build/sim/Build/Products -name "Suhak.app" -maxdepth 3 | head -1)
          echo "앱: $APP"
          DEVICE=$(xcrun simctl create suhak-test \
            "iPhone 16 Pro" \
            $(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -1))
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p shots
          BUNDLE=app.mathroom.suhakjilmoon

          # 탭마다 한 장씩. 홈만 봐서는 어디가 잘못됐는지 알 수 없다.
          # 세 번째 인자를 주면 목록 안쪽 화면까지 열고 찍는다.
          shoot() {   # shoot <탭번호> <파일이름> [깊은화면]
            xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
            if [ -n "$3" ]; then
              xcrun simctl launch "$DEVICE" "$BUNDLE" --tab "$1" --open "$3"
            else
              xcrun simctl launch "$DEVICE" "$BUNDLE" --tab "$1"
            fi
            sleep 9
            xcrun simctl io "$DEVICE" screenshot "shots/$2"
          }

          # 탭은 0 홈, 1 칼럼, 2 시험, 3 모의고사, 4 기록
          xcrun simctl ui "$DEVICE" appearance light
          shoot 0 01-home.png
          shoot 1 02-column.png
          shoot 2 03-exam.png
          shoot 3 04-mock.png
          shoot 4 05-records.png

          # 목록 안쪽. 문항과 수식이 제대로 그려지는지는 여기서만 보인다.
          shoot 0 06-notice.png      notice
          shoot 0 07-notice-post.png post
          shoot 0 08-game.png        game
          shoot 2 09-exam-list.png   exam-list
          shoot 2 10-exam-take.png   exam-take
          shoot 2 11-exam-today.png  exam-today

          # 어두운 화면도 본다
          xcrun simctl ui "$DEVICE" appearance dark
          shoot 0 12-home-dark.png
          shoot 0 13-game-dark.png     game
          shoot 2 14-exam-take-dark.png exam-take

          xcrun simctl shutdown "$DEVICE" || true
          ls -la shots

      - name: 찍은 화면을 screenshots 가지에 올리기
        # 결과물(artifact)은 로그인해야 받을 수 있다.
        # 화면을 눈으로 확인하려면 누구나 볼 수 있는 곳에 있어야 해서 가지 하나에 올린다.
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(ls -A shots 2>/dev/null)" ]; then
            echo "찍은 화면이 없습니다"
            exit 0
          fi
          # 여기서 가지를 갈아타면 작업 폴더의 소스가 통째로 사라져서
          # 뒤에 오는 빌드가 죽는다. 딴 폴더에서 따로 올린다.
          cp -r shots /tmp/shots
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp /tmp/shots/*.png .
          git add ./*.png
          git commit -q -m "화면 $(echo $GITHUB_SHA | cut -c1-7)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
          echo "::notice title=화면::$(ls /tmp/shots | tr '\n' ' ')"

      - name: 실기기용 빌드
        # 화면만 볼 때는 건너뛴다. 3분이 더 든다.
        # 필요하면 Actions 에서 release 를 켜고 직접 돌린다
        if: github.event.inputs.release == 'true'
        # 서명은 애플 개발자 계정이 생긴 뒤에 켠다
        run: |
          source scripts/ci-run.sh
          run "실기기 빌드" xcodebuild \
            -project Suhak.xcodeproj \
            -scheme Suhak \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Suhak.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: ipa 로 묶기
        if: github.event.inputs.release == 'true'
        run: |
          mkdir -p build/Payload
          cp -R build/Suhak.xcarchive/Products/Applications/Suhak.app build/Payload/
          cd build && zip -qry suhakjilmoon-unsigned.ipa Payload
          ls -lh suhakjilmoon-unsigned.ipa
          echo "::notice title=빌드 완료::$(du -h suhakjilmoon-unsigned.ipa | cut -f1) 짜리 앱이 나왔습니다"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: suhakjilmoon-ios
          path: |
            build/suhakjilmoon-unsigned.ipa
            shots/
          retention-days: 30
