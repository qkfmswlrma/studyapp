name: iOS 빌드

# 아이폰 앱은 맥에서만 만들 수 있다. 그래서 깃허브가 빌려주는 맥에서 빌드한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 앱 빌드
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 웹 자산을 앱에 넣기
        # www/ 는 저장소에 들어 있다. 여기서는 그걸 iOS 프로젝트로 복사하고
        # 플러그인 목록(Package.swift)을 맥 기준으로 다시 만든다
        run: |
          npx cap sync ios
          node scripts/fix-ios.js

      - name: 빌드 설정 확인
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -list

      - name: 시뮬레이터용 빌드
        # 애플 개발자 계정 없이도 여기까지는 끝까지 컴파일된다.
        # 코드가 실제로 맥에서 빌드되는지 확인하는 단계다
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 실기기용 빌드
        # 서명은 하지 않는다. 서명하려면 애플 개발자 계정(연 $99)이 필요하다.
        # 서명 없는 결과물은 그대로 아이폰에 못 넣지만, 컴파일이 되는지는 여기서 다 확인된다
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: ipa 로 묶기
        # 서명 전 단계의 ipa. 나중에 계정이 생기면 이걸 서명해서 올리거나,
        # Xcode 에서 열어 바로 내보내면 된다
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -qry suhakjilmoon-unsigned.ipa Payload
          ls -lh suhakjilmoon-unsigned.ipa

      - name: 결과 확인
        run: |
          APP=build/App.xcarchive/Products/Applications/App.app
          echo "=== 앱 정보 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"  "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          echo "=== 웹 자산이 들어갔는지 ==="
          test -f "$APP/public/index.html" || { echo "index.html 이 없습니다"; exit 1; }
          test -d "$APP/public/vendor"     || { echo "vendor 폴더가 없습니다"; exit 1; }
          du -sh "$APP/public"

      - uses: actions/upload-artifact@v4
        with:
          name: suhakjilmoon-ios
          path: |
            build/suhakjilmoon-unsigned.ipa
            build/App.xcarchive
          retention-days: 30
