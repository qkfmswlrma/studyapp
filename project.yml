# XcodeGen 설정. 맥에서 `xcodegen generate` 하면 Suhak.xcodeproj 가 나온다.
#
# 왜 .xcodeproj 를 저장소에 안 넣나
#   윈도우에서는 Xcode 프로젝트 파일을 손으로 못 고친다. 파일 하나 추가할 때마다
#   수천 줄짜리 pbxproj 를 편집해야 하는데 실수하면 통째로 안 열린다.
#   여기서는 Sources/ 폴더를 통째로 가리키므로 파일을 추가해도 이 파일을 안 고쳐도 된다.

name: Suhak

options:
  bundleIdPrefix: app.mathroom
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.54.1"
  SwiftMath:
    # KaTeX 를 대신해 수식을 네이티브로 그린다
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.3"

targets:
  Suhak:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources

    dependencies:
      - package: Supabase
        product: Supabase
      - package: SwiftMath
        product: SwiftMath

    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 수학질문방
        CFBundleName: Suhak
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        # 문제에 사진을 붙일 때 쓴다. 이 문구가 없으면 사진 고르기를 누르는 순간 앱이 꺼진다
        NSCameraUsageDescription: 문제 사진을 바로 찍어서 올릴 때 카메라를 씁니다.
        NSPhotoLibraryUsageDescription: 문제 사진을 올릴 때 사진 보관함에서 고릅니다.
        # 따로 암호화 기능을 넣지 않았다는 표시. 없으면 올릴 때마다 물어본다
        ITSAppUsesNonExemptEncryption: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mathroom.suhakjilmoon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # 서명은 애플 개발자 계정이 생긴 뒤에 켠다
        CODE_SIGN_STYLE: Automatic
